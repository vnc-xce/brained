[project]
name = "brained"
version = "0.1.0"
description = "Cerveau externe : fiches de révision, révision espacée, plan du jour."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
brained = "brained.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brained"]
